[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ltap-rp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiokafka>=0.10",
    "openai>=1.0",
    "pyyaml>=6.0",
    "aiohttp>=3.9",
]

[tool.hatch.build.targets.wheel]
packages = ["ltap_rp"]
