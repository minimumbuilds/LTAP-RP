services:

  redpanda:
    image: redpandadata/redpanda:v24.1.1
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      - --advertise-kafka-addr PLAINTEXT://redpanda:9092,EXTERNAL://localhost:19092
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr localhost:8082
    ports:
      - "19092:19092"
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  console:
    image: redpandadata/console:v2.4.3
    volumes:
      - ./console-config.yaml:/etc/console/config.yaml:ro
    environment:
      - CONFIG_FILEPATH=/etc/console/config.yaml
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  arbiter:
    build:
      context: ..
      dockerfile: LTAP-RP/Dockerfile
    command: python -m ltap_rp.arbiter_main
    volumes:
      - ./config.yaml:/config/config.yaml:ro
    environment:
      - CONFIG_PATH=/config/config.yaml
    depends_on:
      redpanda:
        condition: service_healthy
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"

  chat:
    build:
      context: ..
      dockerfile: LTAP-RP/Dockerfile
    command: python -m ltap_rp.chat_main
    volumes:
      - ./config.yaml:/config/config.yaml:ro
    environment:
      - CONFIG_PATH=/config/config.yaml
      - CHAT_PORT=5000
    ports:
      - "5000:5000"
    depends_on:
      redpanda:
        condition: service_healthy
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"

  agent-alice:
    build:
      context: ..
      dockerfile: LTAP-RP/Dockerfile
    command: python -m ltap_rp.agent_main
    volumes:
      - ./config.yaml:/config/config.yaml:ro
    environment:
      - CONFIG_PATH=/config/config.yaml
      - AGENT_NAME=alice
    depends_on:
      redpanda:
        condition: service_healthy
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"

  agent-bob:
    build:
      context: ..
      dockerfile: LTAP-RP/Dockerfile
    command: python -m ltap_rp.agent_main
    volumes:
      - ./config.yaml:/config/config.yaml:ro
    environment:
      - CONFIG_PATH=/config/config.yaml
      - AGENT_NAME=bob
    depends_on:
      redpanda:
        condition: service_healthy
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"

  agent-carol:
    build:
      context: ..
      dockerfile: LTAP-RP/Dockerfile
    command: python -m ltap_rp.agent_main
    volumes:
      - ./config.yaml:/config/config.yaml:ro
    environment:
      - CONFIG_PATH=/config/config.yaml
      - AGENT_NAME=carol
    depends_on:
      redpanda:
        condition: service_healthy
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"

  agent-dave:
    build:
      context: ..
      dockerfile: LTAP-RP/Dockerfile
    command: python -m ltap_rp.agent_main
    volumes:
      - ./config.yaml:/config/config.yaml:ro
    environment:
      - CONFIG_PATH=/config/config.yaml
      - AGENT_NAME=dave
    depends_on:
      redpanda:
        condition: service_healthy
    restart: on-failure
    extra_hosts:
      - "host.docker.internal:host-gateway"
